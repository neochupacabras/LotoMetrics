name: Importar resultados de loteria

on:
  schedule:
    # O sorteio em si é sempre às 21h BRT (Lotofácil, Mega-Sena, Quina,
    # Lotomania, Dia de Sorte, +Milionária, Timemania, Dupla Sena e Super
    # Sete sorteiam em algum subconjunto de segunda a sexta, sempre às 21h)
    # — roda 20min depois pra dar tempo da Caixa publicar o resultado.
    # `--loteria todas` no modo agendado sincroniza todas de uma vez, então
    # não precisa de um cron por loteria: um só cobre segunda a sexta.
    # 21h20 BRT = 00h20 UTC do dia seguinte → UTC terça a sábado.
    - cron: "20 0 * * 2-6"

    # Desde 19/07/2026 a Caixa moveu o sorteio de sábado para domingo às
    # 11h em Lotofácil, Mega-Sena, Quina, Dia de Sorte, +Milionária e
    # Timemania (Lotomania, Dupla Sena e Super Sete não sorteiam fim de
    # semana, ficam de fora). 11h20 BRT = 14h20 UTC, mesmo domingo.
    - cron: "20 14 * * 0"

    # Segurança: roda todo dia às 3h BRT (6h UTC) pra pegar qualquer
    # resultado que os horários acima tenham perdido.
    - cron: "0 6 * * *"

  workflow_dispatch:
    inputs:
      modo:
        description: "Modo de importação"
        required: true
        default: "incremental"
        type: choice
        options:
          - incremental
          - unico
      loteria:
        description: "Loteria"
        required: true
        default: "todas"
        type: choice
        options:
          - todas
          - lotofacil
          - megasena
          - quina
          - lotomania
          - diadesorte
          - maismilionaria
          - timemania
          - duplasena
          - supersete
      numero:
        description: "Número do concurso (apenas para modo unico)"
        required: false
        type: string

jobs:
  importar:
    name: Importar resultados
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PGHOST: ${{ secrets.PGHOST }}
      PGPORT: ${{ secrets.PGPORT }}
      PGDATABASE: ${{ secrets.PGDATABASE }}
      PGUSER: ${{ secrets.PGUSER }}
      PGPASSWORD: ${{ secrets.PGPASSWORD }}
      PGSSLMODE: require
      REVALIDAR_SECRET: ${{ secrets.REVALIDAR_SECRET }}

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências Python
        run: pip install psycopg2-binary requests

      - name: Executar importador (modo agendado)
        if: github.event_name == 'schedule'
        run: python importador.py --modo incremental --loteria todas

      - name: Executar importador (modo manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.modo }}" = "unico" ] && [ -n "${{ inputs.numero }}" ]; then
            python importador.py \
              --modo unico \
              --loteria ${{ inputs.loteria }} \
              --numero ${{ inputs.numero }}
          else
            python importador.py \
              --modo ${{ inputs.modo }} \
              --loteria ${{ inputs.loteria }}
          fi
